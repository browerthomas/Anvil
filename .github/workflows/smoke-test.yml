name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: anvil smoke suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats jq

      - name: Show versions
        run: |
          bats --version
          jq --version
          bash --version | head -1

      - name: Run smoke suite
        run: make -C tests smoke
